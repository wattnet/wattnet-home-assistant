name: Bug Report
description: Report a bug or unexpected behaviour in the Wattnet Home Assistant integration.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "The Carbon footprint sensor stays unknown even though the Wattnet API is reachable."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps needed to reproduce the behaviour.
      placeholder: |
        1. Add the Wattnet integration for zone ES
        2. Wait for the first update
        3. Observe the sensor state
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the full traceback if applicable.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g. 2026.10.0"
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: Installation Type
      placeholder: "e.g. Home Assistant OS, Container, Core"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Configuration
      description: Paste any relevant log output or configuration (redact credentials).
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context that might help diagnose the issue.
    validations:
      required: false
