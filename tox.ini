[tox]
min_version = 4.3.3
envlist =
    py314
    flake8
    format
    bandit
    mypy

[gh-actions]
python =
    3.14: py314, flake8, format, bandit, mypy

[base]
python = python3.14
src_path = custom_components

[testenv]
basepython = python3.14
deps =
    -r requirements_test.txt
commands =
    pytest -p no:cacheprovider --cov=custom_components.wattnet --cov-report=term-missing --cov-report=xml

[flake8]
max-line-length = 88
show-source = true
exclude =
    .venv
    .git
    .tox
    env
    build
per-file-ignores =
    tests/*: D

[testenv:flake8]
skip_install = true
basepython = {[base]python}
deps =
    flake8
    flake8-bugbear
    flake8-docstrings
    pep8-naming
commands =
    flake8 {[base]src_path}

[testenv:format]
skip_install = true
basepython = {[base]python}
deps =
    black
    isort
commands =
    isort --check --diff {[base]src_path} tests
    black --check --diff {[base]src_path} tests

[testenv:bandit]
skip_install = true
basepython = {[base]python}
deps =
    bandit
commands =
    bandit -r {[base]src_path}

[testenv:mypy]
description = Static type checks
basepython = {[base]python}
deps =
    -r requirements_test.txt
    mypy
commands =
    mypy {[base]src_path}
