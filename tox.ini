[tox]
min_version = 4.3.3
envlist =
    py314
    lint
    format-check
    bandit
    mypy

[gh-actions]
python =
    3.14: py314, lint, format-check, bandit, mypy

[base]
python = python3.14
src_path = custom_components

[testenv]
basepython = python3.14
deps =
    -r requirements_test.txt
commands =
    pytest -p no:cacheprovider --cov=custom_components.wattnet --cov-report=term-missing --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

[testenv:lint]
skip_install = true
basepython = {[base]python}
deps =
    ruff
commands =
    ruff check {[base]src_path}

[testenv:format]
skip_install = true
basepython = {[base]python}
deps =
    ruff
commands =
    ruff format {[base]src_path} tests

[testenv:format-check]
skip_install = true
basepython = {[base]python}
deps =
    ruff
commands =
    ruff format --check --diff {[base]src_path} tests

[testenv:bandit]
skip_install = true
basepython = {[base]python}
deps =
    bandit
commands =
    bandit -r {[base]src_path}

[testenv:mypy]
description = Static type checks
basepython = {[base]python}
deps =
    -r requirements_test.txt
    mypy
commands =
    mypy {[base]src_path}
